[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tardis-tabular"
version = "1.0.0"
description = "TARDIS: inference-time refinement of a pre-trained tabular diffusion backbone (NeurIPS 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Eugenio Lomurno" },
  { name = "Filippo Balzarini" },
  { name = "Francesco Benelle" },
  { name = "Francesca Pia Panaccione" },
  { name = "Matteo Matteucci" },
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "xgboost>=2.0",
  "optuna>=3.0",
  "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tardis = "tardis.cli:main"

[tool.setuptools.packages.find]
include = ["tardis*"]
